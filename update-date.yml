name: Update Date CSS

on:
  schedule:
   
    - cron: '10 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone to Bangkok
        run: |
          sudo apt-get update
          sudo apt-get install -y tzdata
          sudo ln -fs /usr/share/zoneinfo/Asia/Bangkok /etc/localtime
          sudo dpkg-reconfigure -f noninteractive tzdata

      - name: Generate CSS
        run: |
          TODAY=$(date +%F)

          cat > today.css << EOF
          .timetable-day {
              display: none !important;
          }

          .timetable-day[data-date="$TODAY"] {
              display: block !important;
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add today.css
          git diff --cached --quiet || (
            git commit -m "Update date to $TODAY"
            git push
          )
