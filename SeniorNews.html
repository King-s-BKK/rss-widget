<script>
  const feedUrl = 'https://script.googleusercontent.com/macros/echo?user_content_key=AehSKLjx3mTEC0Lv572g71aibC7sBHt-JadfAs6GLvnhU3XTZXt6QyMBxP922httMQrnhvlgdgLNr3FPH0kZRK-zF8zT14EXY_8j3orXJXxeBx6ffsOH9wuTIZuZ_BU-Xa91gVPNhlbyOZn1vwBUkTQYgTD3npcgKheclS05k0nvRqOfSfXJat9Gqbdy0pNXJlh1X1lj3-kINIvCnD5BGDxsjbtbMSfwdF_-fNm81wtJYpTJULtksgN4zw2-idLdzebXRhVQr0WJxfBj9OaWrXj_OBZqcFKugg&lib=Ms5gNQsySATORVaDn-PTHatucTm4bx3Zi';

  fetch(feedUrl)
    .then(response => {
      if (!response.ok) throw new Error("Network response was not ok");
      return response.json();
    })
    .then(items => {
      const container = document.getElementById('rss-feed');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerText = 'No Senior School News';
        return;
      }

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'rss-item';
        div.innerHTML = `
          <h3>
            <a href="https://king-s-college-international-school-bangkok.myschoolportal.co.uk/feed/287" target="_blank">
              ${item.title}
            </a>
            <span style="margin-left: 10px; font-weight: normal; font-size: 0.9em;">
              (${new Date(item.pubDate).toLocaleDateString()})
            </span>
          </h3>
        `;
        container.appendChild(div);
      });
    })
    .catch(error => {
      document.getElementById('rss-feed').innerText = 'Failed to load feed.';
      console.error('Error fetching RSS:', error);
    });
</script>
