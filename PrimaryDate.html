<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      font-family: 'Lato', sans-serif;
      font-size: 12px;
      font-weight: 300;
    }

    #rss-feed {
      padding: 10px;
    }

    .rss-item {
      border-bottom: 1px solid #ddd;
      padding: 6px 0;
      margin-bottom: 8px;
    }

    .rss-row {
      display: grid;
      grid-template-columns: 1fr 95px;
      gap: 10px;
      align-items: start;
    }

    .rss-title a {
      color: #0077cc;
      text-decoration: none;
      font-size: 12px;
      line-height: 15px;
      display: block;
    }

    .rss-title a:hover {
      text-decoration: underline;
    }

    .rss-date {
      text-align: right;
      white-space: nowrap;
      color: #666;
      font-size: 11px;
      line-height: 15px;
    }

    @media (max-width: 600px) {
      #rss-feed {
        padding: 5px;
      }

      .rss-row {
        grid-template-columns: 1fr 80px;
        gap: 5px;
      }

      .rss-title a {
        font-size: 12px;
      }

      .rss-date {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div id="rss-feed">Loading feed...</div>

<script>
const feedUrl =
  'https://script.googleusercontent.com/macros/echo?user_content_key=AehSKLj0UDNWrSlPPjDDTHELVacs030gJUgStu2Hs0q5zzXZrOoKwU7lbrxmFV4IroExm9fepVyZO9RSw3WehgDscCRMpoIFv-BvxkVqQRFvIH5_dClLWW9LLsxGJTZJAj8iwxET_ToMoQSidDVUsevnQoqpUJopFaMTbsddEuO2pysVcyrWERhtGV62Grd985D-UHLzzS8nAY8MJaWntgJEqt330gDOxNGtBjI-HHlAjHdWGUQYI-eqCR-ME12ic5j_fHBkedXTIxStnl7cscdm4ZlJzt6G0qh3zsYC4dvp&lib=Meds3W3wlHTnFBNQH4TgQ38czIEwHG0G6';

fetch(feedUrl)
  .then(response => {
    if (!response.ok) {
      throw new Error('Network response was not ok');
    }
    return response.json();
  })
  .then(items => {
    const container = document.getElementById('rss-feed');
    container.innerHTML = '';

    if (!items || items.length === 0) {
      container.innerText = 'No Primary School News';
      return;
    }

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'rss-item';

      const formattedDate = new Date(item.pubDate)
        .toLocaleDateString('en-GB');

      div.innerHTML = `
        <div class="rss-row">
          <div class="rss-title">
            <a href="https://king-s-college-international-school-bangkok.myschoolportal.co.uk/feed/286"
               target="_blank"
               rel="noopener noreferrer">
              ${item.title}
            </a>
          </div>

          <div class="rss-date">
            ${formattedDate}
          </div>
        </div>
      `;

      container.appendChild(div);
    });
  })
  .catch(error => {
    console.error('Error fetching RSS:', error);
    document.getElementById('rss-feed').innerText =
      'Failed to load feed.';
  });
</script>

</body>
</html>
