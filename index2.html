<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>King's Bangkok Translator</title>
  <style>
    body { font-family: Lato, sans-serif; }
    #translateBtn {
      background-color: #1294ae;
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h2>King's Bangkok Translator</h2>
  <select id="targetLang">
    <option value="th">Thai</option>
    <option value="de">German</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
  </select>
  <button id="translateBtn">Translate Page</button>

  <div style="font-family:Lato, sans-serif; border:1px solid #eee; margin-top:20px;">
    <a href="https://king-s-college-international-school-bangkok.myschoolportal.co.uk/pupil-documents/256" target="_blank"
       style="display:flex; align-items:center; justify-content:space-between; width:100%; box-sizing:border-box;
              padding:8px 16px; text-decoration:none; color:#1294ae; border-bottom:1px solid #e5e5e5;" rel="nofollow">
      <div style="display:flex; align-items:flex-start;">
        <figure style="margin:0;">
          <img src="https://king-s-bkk.github.io/rss-widget/School%20Reports.png"
               style="display:block; width:25px; height:25px; margin-right:8px;">
        </figure>
        <div>
          <div>School Reports</div>
          <div style="color:#999; margin-top:1px; line-height:1.2; font-size:13px;">
            View and export academic school reports and assessment
          </div>
        </div>
      </div>
      <span style="font-size:18px; color:#999; line-height:1;">›</span>
    </a>
  </div>

  <script>
    async function translateText(text, lang) {
      const response = await fetch(
        'https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&to=' + lang,
        {
          method: 'POST',
          headers: {
            'Ocp-Apim-Subscription-Key': 'YOUR_API_KEY',
            'Ocp-Apim-Subscription-Region': 'YOUR_REGION',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify([{ Text: text }])
        }
      );
      const result = await response.json();
      return result[0].translations[0].text;
    }

    document.getElementById('translateBtn').addEventListener('click', async () => {
      const lang = document.getElementById('targetLang').value;
      const elements = document.querySelectorAll('body *:not(script):not(style):not(img)');
      for (const el of elements) {
        if (el.childNodes.length === 1 && el.childNodes[0].nodeType === 3) {
          const original = el.textContent.trim();
          if (original) {
            try {
              const translated = await translateText(original, lang);
              el.textContent = translated;
            } catch (e) {
              console.error('Translation failed for:', original);
            }
          }
        }
      }
    });
  </script>
</body>
</html>
