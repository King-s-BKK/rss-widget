<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      font-family: 'Lato', sans-serif;
      font-size: 12px;
      font-weight: 300;
    }

    #rss-feed {
      padding: 10px;
    }

    .rss-item {
      border-bottom: 1px solid #ddd;
      padding: 6px 0;
      margin-bottom: 8px;
    }

    .rss-title a {
      color: #0077cc;
      text-decoration: none;
      font-size: 12px;
      line-height: 15px;
      display: block;
    }

    .rss-title a:hover {
      text-decoration: underline;
    }

    .rss-date {
      text-align: right;
      white-space: nowrap;
      color: #666;
      font-size: 11px;
      line-height: 15px;
    }
  </style>
</head>

<body>

<div id="rss-feed">Loading feed...</div>

<script>
const feedUrl = 
  'https://script.google.com/macros/s/AKfycbwVok1xc89LLdQoQv7AVDVfWQVeXWb9oomUuvVLvKCDVffUhcRF8Y3U-Muq9AK6R9iJrA/exec';

fetch(feedUrl)
  .then(response => {
    if (!response.ok) throw new Error('Network response was not ok');
    return response.text(); // <-- Expect HTML, not JSON
  })
  .then(html => {
    const container = document.getElementById('rss-feed');
    container.innerHTML = '';

    if (!html || html.trim() === '') {
      container.innerText = 'No Whole School News';
      return;
    }

    // Parse the returned HTML string
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const links = doc.querySelectorAll('a');

    links.forEach(link => {
      const div = document.createElement('div');
      div.className = 'rss-item';

      div.innerHTML = `
        <div class="rss-title">
          <a href="${link.getAttribute('href') !== 'null' ? link.href : '#'}" 
             target="_blank" rel="noopener noreferrer">
            ${link.textContent}
          </a>
        </div>
      `;

      container.appendChild(div);
    });
  })
  .catch(error => {
    console.error('Error fetching RSS:', error);
    document.getElementById('rss-feed').innerText = 'Failed to load feed.';
  });
</script>

</body>
</html>
