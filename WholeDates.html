<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Lato Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 13px;
      font-weight: 300;
    }

    #rss-feed {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /* Each RSS item uses the full page width */
    .rss-item {
      width: 100%;
      margin: 0;
      padding: 7px 0;
      border-bottom: 1px solid #ddd;
    }

    /* Title left / Date right */
    .rss-row {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .rss-title {
      flex: 1 1 auto;
      min-width: 0;
    }

    .rss-title a {
      display: block;
      width: 100%;
      color: #0077cc;
      text-decoration: none;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 13px;
      font-weight: 300;
      line-height: 18px;
    }

    .rss-title a:hover {
      text-decoration: underline;
    }

    .rss-date {
      flex: 0 0 auto;
      margin-left: auto;
      text-align: right;
      white-space: nowrap;
      color: #666;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 12px;
      font-weight: 300;
      line-height: 18px;
    }

    /* Mobile */
    @media (max-width: 600px) {

      #rss-feed {
        width: 100%;
      }

      .rss-item {
        padding: 7px 0;
      }

      .rss-row {
        gap: 10px;
      }

      .rss-title a {
        font-size: 12px;
        line-height: 17px;
      }

      .rss-date {
        font-size: 11px;
        line-height: 17px;
      }
    }
  </style>
</head>

<body>

<div id="rss-feed">Loading feed...</div>

<script>

const feedUrl =
'https://script.googleusercontent.com/a/macros/kingsbangkok.ac.th/echo?user_content_key=AUkAhnSSz48DN0qRmeHGNnSEPMz8KaZTsgOAi_1QHhy7P28M7sHC_xSmsUXIH19tc4N9dpKTrBKkFQF6wg2mKLKW9kg8krCq4yPf1YxKrcxal4EaX0Hyi1kn_xnY2NxW-Vq_Ko9P9T4gqWCAy3qyB-apmi_CMqcmNls4Lja214yzgqWPXAq_9JPJXwOV1vdPN2ve267Chwl1Opv9_7y5FvAZytEXOIvCOMFteRFwhu-I4ily4kcz_E5T--rhwXijcU79jd5h0eU0mUAEF3_dlEssgZQ2GtF0f_3jK4Svi52o6ynED8-jtS0FH8HKkA08qg&lib=Meds3W3wlHTnFBNQH4TgQ38czIEwHG0G6';


fetch(feedUrl)

  .then(response => {

    if (!response.ok) {
      throw new Error('Network response was not ok');
    }

    return response.text();

  })

  .then(html => {

    const container = document.getElementById('rss-feed');

    container.innerHTML = '';

    // Read HTML returned by Google Apps Script
    const parser = new DOMParser();

    const doc = parser.parseFromString(html, 'text/html');

    const rows = doc.querySelectorAll('.rss-row');

    if (!rows.length) {

      container.innerText = 'No Whole School News';

      return;
    }

    rows.forEach(row => {

      const titleElement = row.querySelector('.rss-title a');
      const dateElement = row.querySelector('.rss-date');

      const title = titleElement
        ? titleElement.textContent.trim()
        : '';

  const link = 'https://king-s-college-international-school-bangkok.myschoolportal.co.uk/feed/284';


      const date = dateElement
        ? dateElement.textContent.trim()
        : '';

      const div = document.createElement('div');

      div.className = 'rss-item';

      div.innerHTML = `

        <div class="rss-row">

          <div class="rss-title">
            <a href="${link}"
               target="_blank"
               rel="noopener noreferrer">
              ${title}
            </a>
          </div>

          <div class="rss-date">
            ${date}
          </div>

        </div>

      `;

      container.appendChild(div);

    });

  })

  .catch(error => {

    console.error('Error fetching RSS:', error);

    document.getElementById('rss-feed').innerText =
      'Failed to load feed.';

  });

</script>

</body>
</html>
