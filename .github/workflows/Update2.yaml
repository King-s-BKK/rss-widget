name: Update Date CSS

on:
  schedule:
    - cron: '24 12 * * *'   # 12:24 UTC = 19:24 ICT (Thailand)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CSS
        run: |
          TODAY="2026-07-17"

          cat > today.css << EOF
          .timetable-day {
              display: none !important;
          }

          .timetable-day[data-date="$TODAY"] {
              display: block !important;
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add today.css

          git diff --cached --quiet || (
            git commit -m "Update date to $TODAY"
            git push
          )
