name: "Update Date CSS"

on:
workflow_dispatch:
schedule:
- cron: "5 17 * * *"

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest


steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate CSS
    shell: bash
    run: |
      TODAY=$(TZ=Asia/Bangkok date -d '+1 day' +%F)

      cat > today.css <<EOF
      .timetable-day {
          display: none !important;
      }

      .timetable-day[data-date="$TODAY"] {
          display: block !important;
      }
      EOF

  - name: Commit changes
    shell: bash
    run: |
      TODAY=$(TZ=Asia/Bangkok date -d '+1 day' +%F)

      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

      git add today.css

      if ! git diff --cached --quiet; then
        git commit -m "Update date to $TODAY"
        git push
      fi
```
