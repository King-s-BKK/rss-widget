name: Update Date CSS

on:
  schedule:
    - cron: '5 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CSS
        run: |
          TODAY=$(TZ=Asia/Bangkok date -d '+1 day' +%F)
          cat > today.css << EOF
          .timetable-day {
              display: none !important;
          }
          .timetable-day[data-date="$TODAY"] {
              display: block !important;
          }
          EOF

      - name: Cache Bust HTML Reference
        run: |
          # Replaces today.css or today.css?v=anything with today.css?v=RUN_ID
          sed -i -E "s/today\.css(\?v=[a-zA-Z0-9_\-]+)?/today.css?v=${{ github.run_id }}/g" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Add both the new CSS and the updated HTML file
          git add today.css index.html
          
          git diff --cached --quiet || (
            git commit -m "Update date to $TODAY and cache bust"
            git push
          )
