<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      width: 100%;
      height: auto;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      color: #333;
      font-weight: 300;
    }

    #rss-feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .rss-item {
      border-bottom: 1px solid #ddd;
      padding: 5px 0;
    }

    .rss-item h3 {
    
      margin: 0;
      color: #0077cc;
      font-weight: 300;
    }

    .rss-item p {
      margin: 5px 0;
      color: #555;
    }

    /* 💻 Desktop styles */
    @media (min-width: 601px) {
      html, body {
        font-size: 14px;
      }

      h1 {
        font-size: 14px;
      }

      .rss-item h3 {
        font-size: 14px;
      }

      .rss-item h3 span {
          font-size: 14px;
   
      }
    }

    /* 📱 Mobile styles */
    @media (max-width: 600px) {
      html, body {
        font-size: 11px;
      }

      h1 {
        font-size: 10px;
      }

      #rss-feed {
        padding: 5px;
      }

      .rss-item {
        padding: 3px 0;
      }

      .rss-item h3 {
        font-size: 10px;
      }

      .rss-item p {
        margin: 3px 0;
      }

      .rss-item h3 span {
        font-size: 0.8em;
      }
    }
  </style>
</head>
<body>

  <h1>Wholeschool News</h1>
  <div id="rss-feed">Loading feed...</div>

  <script>
    const feedUrl = 'https://script.googleusercontent.com/macros/echo?user_content_key=AehSKLiwr7AHuSgIhe3mxk-gjRrUQXVtiz-FuBmihVD2G8JKL_QGHgU8ow4zPj325V4C1G-Wwv7Wc8-U-AIgV-GtdaSFuQMhc12MqiFQfVAqNSG6APgFTkQECR3QNzJNw-ZArVU1_rSWDuBRSCSqP0Um56oGUxdoUT5gO0IhtdOdQzq_cxqPLgkjgtUVdO5r64toJzIv8YLKQgVuxQ8GfdnRbaeasRlInzBs77Cs1joR6JWxe8uWgPb8KsrehAIKrMiumzm6fwTSsUHP4CxrtNk2yvNCpltwLnVjJi8ziUV7&lib=Meds3W3wlHTnFBNQH4TgQ38czIEwHG0G6';

    fetch(feedUrl)
      .then(response => {
        if (!response.ok) throw new Error("Network response was not ok");
        return response.json();
      })
      .then(items => {
        const container = document.getElementById('rss-feed');
        container.innerHTML = '';

        if (!items || items.length === 0) {
          container.innerText = 'No Wholeschool news';
          return;
        }

        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'rss-item';
          div.innerHTML = `
            <h3>
              <a href="https://king-s-college-international-school-bangkok.myschoolportal.co.uk/feed/284" target="_blank">
                ${item.title}
              </a>
              <span style="margin-left: 10px; font-weight: normal; font-size: 0.9em;">
                (${new Date(item.pubDate).toLocaleDateString()})
              </span>
            </h3>
          `;
          container.appendChild(div);
        });
      })
      .catch(error => {
        document.getElementById('rss-feed').innerText = 'Failed to load feed.';
        console.error('Error fetching RSS:', error);
      });
  </script>
</body>
</html>
