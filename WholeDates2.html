<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      font-family: 'Lato', sans-serif;
      font-size: 12px;
      font-weight: 300;
    }

    #rss-feed {
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    .rss-item {
      border-bottom: 1px solid #ddd;
      padding: 6px 0;
      margin-bottom: 8px;
    }

    /* TITLE LEFT — DATE RIGHT */
    .rss-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 95px;
      column-gap: 15px;
      align-items: start;
      width: 100%;
    }

    .rss-title {
      min-width: 0;
    }

    .rss-title a {
      color: #0077cc;
      text-decoration: none;
      font-size: 12px;
      line-height: 15px;
      display: block;
    }

    .rss-title a:hover {
      text-decoration: underline;
    }

    .rss-date {
      text-align: right;
      white-space: nowrap;
      color: #666;
      font-size: 11px;
      line-height: 15px;
    }

    @media (max-width: 600px) {
      #rss-feed {
        padding: 5px;
      }

      .rss-row {
        grid-template-columns: minmax(0, 1fr) 80px;
        column-gap: 8px;
      }

      .rss-title a {
        font-size: 12px;
      }

      .rss-date {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div id="rss-feed">Loading feed...</div>

<script>
const feedUrl =
'https://script.googleusercontent.com/a/macros/kingsbangkok.ac.th/echo?user_content_key=AUkAhnSSz48DN0qRmeHGNnSEPMz8KaZTsgOAi_1QHhy7P28M7sHC_xSmsUXIH19tc4N9dpKTrBKkFQF6wg2mKLKW9kg8krCq4yPf1YxKrcxal4EaX0Hyi1kn_xnY2NxW-Vq_Ko9P9T4gqWCAy3qyB-apmi_CMqcmNls4Lja214yzgqWPXAq_9JPJXwOV1vdPN2ve267Chwl1Opv9_7y5FvAZytEXOIvCOMFteRFwhu-I4ily4kcz_E5T--rhwXijcU79jd5h0eU0mUAEF3_dlEssgZQ2GtF0f_3jK4Svi52o6ynED8-jtS0FH8HKkA08qg&lib=Meds3W3wlHTnFBNQH4TgQ38czIEwHG0G6';

fetch(feedUrl)
  .then(response => {
    if (!response.ok) {
      throw new Error('Network response was not ok');
    }

    return response.text();
  })
  .then(html => {

    const container = document.getElementById('rss-feed');
    container.innerHTML = '';

    // Parse the HTML returned by Google Apps Script
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    const rows = doc.querySelectorAll('.rss-row');

    if (!rows.length) {
      container.innerText = 'No Whole School News';
      return;
    }

    rows.forEach(row => {

      const titleElement = row.querySelector('.rss-title a');
      const dateElement = row.querySelector('.rss-date');

      const title = titleElement
        ? titleElement.textContent.trim()
        : '';

      const link = titleElement
        ? titleElement.getAttribute('href') || '#'
        : '#';

      const date = dateElement
        ? dateElement.textContent.trim()
        : '';

      const div = document.createElement('div');
      div.className = 'rss-item';

      div.innerHTML = `
        <div class="rss-row">

          <div class="rss-title">
            <a href="${link}"
               target="_blank"
               rel="noopener noreferrer">
              ${title}
            </a>
          </div>

          <div class="rss-date">
            ${date}
          </div>

        </div>
      `;

      container.appendChild(div);
    });

  })
  .catch(error => {

    console.error('Error fetching RSS:', error);

    document.getElementById('rss-feed').innerText =
      'Failed to load feed.';

  });
</script>

</body>
</html>
