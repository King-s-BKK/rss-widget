<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 20px;
    }

    #rss-feed {
      max-width: 600px;
      margin: auto;
    }

    .rss-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #ddd; /* Divider line */
    }

    .rss-title a {
      color: #0077cc;
      text-decoration: none;
    }

    .rss-title a:hover {
      text-decoration: underline;
    }

    .rss-date {
      color: #666;
      font-size: 13px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="rss-feed">Loading feed...</div>

<script>
const feedUrl = "https://script.googleusercontent.com/a/macros/kingsbangkok.ac.th/echo?user_content_key=AUkAhnSSz48DN0qRmeHGNnSEPMz8KaZTsgOAi_1QHhy7P28M7sHC_xSmsUXIH19tc4N9dpKTrBKkFQF6wg2mKLKW9kg8krCq4yPf1YxKrcxal4EaX0Hyi1kn_xnY2NxW-Vq_Ko9P9T4gqWCAy3qyB-apmi_CMqcmNls4Lja214yzgqWPXAq_9JPJXwOV1vdPN2ve267Chwl1Opv9_7y5FvAZytEXOIvCOMFteRFwhu-I4ily4kcz_E5T--rhwXijcU79jd5h0eU0mUAEF3_dlEssgZQ2GtF0f_3jK4Svi52o6ynED8-jtS0FH8HKkA08qg&lib=Meds3W3wlHTnFBNQH4TgQ38czIEwHG0G6";

fetch(feedUrl)
  .then(response => {
    if (!response.ok) throw new Error("Network response was not ok");
    return response.text(); // Expect HTML
  })
  .then(html => {
    const container = document.getElementById("rss-feed");
    container.innerHTML = "";

    if (!html || html.trim() === "") {
      container.innerText = "No feed available";
      return;
    }

    // Parse the returned HTML string
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const rows = doc.querySelectorAll(".rss-row");

    rows.forEach(row => {
      container.appendChild(row);
    });
  })
  .catch(error => {
    console.error("Error fetching RSS:", error);
    document.getElementById("rss-feed").innerText = "Failed to load feed.";
  });
</script>

</body>
</html>
