<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RSS Feed Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 300;
      width: 100%;
      height: auto;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 12px;
      font-weight: 300;
    }

    #rss-feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .rss-item {
      border-bottom: 1px solid #ddd;
      padding: 5px 0;
    }

    .rss-item h3 {
      margin: 0;
      font-size: 12px;
      color: #0077cc;
      font-weight: 300;
    }

    .rss-item p {
      margin: 5px 0;
      color: #555;
    }

    /* 📱 Mobile styles */
    @media (max-width: 600px) {
      html, body {
        font-size: 11px;
      }

      h1 {
        font-size: 10px;
      }

      #rss-feed {
        padding: 5px;
      }

      .rss-item {
        padding: 3px 0;
      }

      .rss-item h3 {
        font-size: 10px;
      }

      .rss-item p {
        margin: 3px 0;
      }

      .rss-item h3 span {
        font-size: 0.8em;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap" rel="stylesheet">
</head>
<body>

  <div id="rss-feed">Loading feed...</div>

  <script>
    const feedUrl = 'https://script.googleusercontent.com/macros/echo?user_content_key=AehSKLibNsLTHxJ-JFj5pKqXPSr1xZ6TblJmxdKUDEZd8UPB9zIPfBwnw2N3EcEKEpJz8PlO4pm_Cpu2ts4pdgbzM3oFytzn3NW187qyCxDPCf9m3XZWeppiMjGJsfy5agfT--WiT_lK7JDs7AxcnnokgOTE5IysVfwJj8JTaY7UR22LEuVHKAe_IDVr_0eaMT4w0e9n1qY1v-c92_8ZtRJA80xMHiejmhzV-ijzYNA0sIZNyd70YeQ5RryUxZIkmRxJFPZjLlfYLSzGUn51-x7v9yHBT5QjsA&lib=MpvUY-OZDL0L7xkeT9cAcpducTm4bx3Zi';

    fetch(feedUrl)
      .then(response => {
        if (!response.ok) throw new Error("Network response was not ok");
        return response.json();
      })
      .then(items => {
        const container = document.getElementById('rss-feed');
        container.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'rss-item';
          div.innerHTML = `
            <h3>
              <a href="https://king-s-college-international-school-bangkok.myschoolportal.co.uk/feed/284" target="_blank">
                ${item.title}
              </a>
              <span style="margin-left: 10px; font-weight: normal; font-size: 0.9em;">
                (${new Date(item.pubDate).toLocaleDateString()})
              </span>
            </h3>
          `;
          container.appendChild(div);
        });
      })
      .catch(error => {
        document.getElementById('rss-feed').innerText = 'Failed to load feed.';
        console.error('Error fetching RSS:', error);
      });
  </script>
</body>
</html>
