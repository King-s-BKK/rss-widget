<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AQI Widget</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --aqi-green-300:#8DBAED !important;
    --aqi-green-500:#a9c8eb !important;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent !important;
}

body{
    position:relative;
}

.widget-container{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:100%;
    padding:0;
    background:transparent !important;
}

.airvisual-wrapper{
    position:absolute;
    left:0;
    bottom:0;
    transform-origin:bottom left;
    transform:scale(0.40);
}

[name="airvisual_widget"]{
    display:block;
    margin:0;
}
</style>

</head>

<body>

<div class="widget-container">
    <div class="airvisual-wrapper">
        <div name="airvisual_widget" key="SuS8oc7aRdnzpG52A"></div>
    </div>
</div>

<script src="https://widget.iqair.com/script/widget_v3.0.js"></script>

</body>
</html>
